# Nginx configuration example for mqvpn H2 Proxy with Proxy Protocol v2
#
# This config demonstrates two approaches:
#   1. Dedicated port with proxy_protocol (recommended)
#   2. Mixed port with conditional handling (advanced)

# ============================================================================
# Approach 1: Dedicated Ports (Recommended)
# ============================================================================
# Use separate ports for Proxy Protocol and direct access.
# This is the cleanest and most performant approach.

http {
    # Port 8443: Accepts connections WITH Proxy Protocol from mqvpn
    server {
        listen 127.0.0.1:8443 proxy_protocol;
        listen [::1]:8443 proxy_protocol;
        server_name _;

        # Log real client IP from Proxy Protocol
        access_log /var/log/nginx/mqvpn-access.log combined;

        # Use Proxy Protocol variables
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header proxy_protocol;

        location / {
            # Your application
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Real-Port $proxy_protocol_port;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        }
    }

    # Port 8444: Direct access WITHOUT Proxy Protocol (for testing, internal use)
    server {
        listen 127.0.0.1:8444;
        listen [::1]:8444;
        server_name _;

        access_log /var/log/nginx/direct-access.log combined;

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    upstream backend {
        server 127.0.0.1:9000;
    }
}

# ============================================================================
# Approach 2: Mixed Port with Conditional Handling (Advanced)
# ============================================================================
# This approach uses a SINGLE port but requires stream module preprocessing.
# More complex, but useful when you can't dedicate separate ports.
#
# IMPORTANT: This requires Nginx stream module and happens BEFORE http processing.

stream {
    # Preprocess connections on port 8443
    upstream http_backend {
        server 127.0.0.1:8445;  # Internal port for Proxy Protocol traffic
    }

    upstream http_direct {
        server 127.0.0.1:8446;  # Internal port for direct traffic
    }

    # JavaScript to detect Proxy Protocol v2 signature
    js_import utils from /etc/nginx/detect_proxy_protocol.js;
    js_set $is_proxy_protocol utils.is_proxy_protocol;

    # Split logic (simplified - actual implementation needs js_preread)
    map $is_proxy_protocol $backend_port {
        default 8446;  # Direct
        1       8445;  # Proxy Protocol
    }

    server {
        listen 8443;
        js_preread utils.detect_protocol;

        # Route to appropriate backend based on protocol detection
        proxy_pass 127.0.0.1:$backend_port;
    }
}

http {
    # Internal: Handle Proxy Protocol traffic
    server {
        listen 127.0.0.1:8445 proxy_protocol;
        server_name _;

        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        }
    }

    # Internal: Handle direct traffic
    server {
        listen 127.0.0.1:8446;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    upstream backend {
        server 127.0.0.1:9000;
    }
}

