name: Performance Tests

# Manual trigger only. Two independent reasons, and both must stop applying
# before a push or PR trigger goes back in:
#
#   1. `runs-on: perf-test` is a self-hosted label, and this fork has no
#      runner registered under it. A triggered run therefore never starts —
#      it queues, and the next request entering the shared `perf-test`
#      concurrency group drops it ("Canceling since a higher priority
#      waiting request for perf-test exists"). Every push to main spent a
#      run that way: 53 runs, 53 cancellations, zero benchmark results.
#   2. A self-hosted box must never execute untrusted code, which rules out
#      a PR trigger no matter what the runner situation is.
#
# e6766b3 already made this manual-only for reason 1; 892c7bb ("refresh
# workflows from upstream 0.16.0") took upstream's triggers back wholesale.
# Upstream runs its own perf machine, this fork does not — so keep the fork's
# version of this block when re-syncing workflows.
#
# Runner requires: cmake gcc make git libevent-dev golang iptables
#                  iproute2 iperf3 python3 jq openssl aws-cli
# Publishing also needs the R2_* repository secrets (see the last steps).

on:
  workflow_dispatch:

permissions:
  contents: read

# Group shared with perf-weekly.yml deliberately: both target the single
# `perf-test` machine, and two benchmark suites on one box would be
# measuring each other. cancel-in-progress is false so a manual run queues
# behind the weekly suite rather than killing a 2-hour job mid-flight — the
# old `true` here meant any push to main could do exactly that.
concurrency:
  group: perf-test
  cancel-in-progress: false

jobs:
  perf-test:
    runs-on: perf-test
    timeout-minutes: 30
    steps:
      - name: Pre-checkout cleanup (root-owned files)
        run: sudo rm -rf ci_bench_results bench_results

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply xquic patches
        shell: bash
        run: bash scripts/apply_xquic_patches.sh

      - name: Cleanup stale state
        run: |
          sudo pkill -f 'mqvpn.*ci-bench' || true
          sudo ip netns del ci-bench-server 2>/dev/null || true
          sudo ip netns del ci-bench-client 2>/dev/null || true
          sudo pkill -f 'iperf3' || true

      - name: Clean previous build
        run: |
          rm -rf third_party/xquic/third_party/boringssl/build
          rm -rf third_party/xquic/build
          rm -rf build

      - name: Build BoringSSL
        run: |
          cd third_party/xquic/third_party/boringssl
          mkdir -p build && cd build
          # CMAKE_BUILD_TYPE is mandatory: BoringSSL sets no default, so
          # omitting it benchmarks an -O0 crypto library. Measured on the
          # netns harness: ~21% lower VPN throughput across single-path,
          # MinRTT and WLB. Results from before this line are not comparable.
          cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
          make -j$(nproc) ssl crypto

      - name: Verify BoringSSL is an optimized build
        run: bash scripts/ci_check_bssl_optimized.sh third_party/xquic/third_party/boringssl/build

      - name: Build xquic
        run: |
          cd third_party/xquic
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DSSL_TYPE=boringssl \
                -DXQC_ENABLE_BBR2=ON \
                -DXQC_ENABLE_FEC=ON \
                -DXQC_ENABLE_XOR=ON \
                -DCMAKE_C_FLAGS="-Wno-dangling-pointer" ..
          make -j$(nproc)

      - name: Build mqvpn (Release)
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DXQUIC_BUILD_DIR=../third_party/xquic/build ..
          make -j$(nproc)

      - name: Raw throughput benchmark (TCP DL)
        run: sudo bash scripts/ci_benchmarks/ci_bench_raw_throughput.sh build/mqvpn

      - name: Failover benchmark (WLB + MinRTT)
        run: sudo bash scripts/ci_benchmarks/ci_bench_failover.sh build/mqvpn

      - name: Aggregation benchmark (WLB + MinRTT)
        run: sudo bash scripts/ci_benchmarks/ci_bench_aggregate.sh build/mqvpn

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.sha }}
          path: ci_bench_results/*.json
          retention-days: 90

      - name: Verify aws-cli is installed on runner
        if: success()
        run: aws --version

      - name: Publish results to R2
        if: success()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/ci_publish/publish_to_r2.sh perf-data push

      - name: Post-job cleanup (root-owned files)
        if: always()
        run: sudo rm -rf ci_bench_results
