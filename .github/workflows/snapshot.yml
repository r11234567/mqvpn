name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/snapshot.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build-packages.yml'
      - '.github/workflows/windows-gui.yml'
      - '.github/workflows/android-repro.yml'
      - 'scripts/resolve_build_version.sh'
      - 'scripts/prepare_publish_assets.sh'
      - 'scripts/*windows*.ps1'
      - 'cmake/BuildVersion.cmake'
      - 'android/app/build.gradle.kts'

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: snapshot

  publish-snapshot:
    if: github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve build version
        run: bash scripts/resolve_build_version.sh >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Verify complete platform set and generate SHA256SUMS
        run: bash scripts/prepare_publish_assets.sh artifacts "$VERSION"

      - name: Publish rolling snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$latest" = "$GITHUB_SHA" ] || {
            echo "main advanced to $latest; refusing to publish stale snapshot $GITHUB_SHA"
            exit 0
          }

          if gh release view snapshot >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/snapshot" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit snapshot \
              --title "mqvpn $VERSION_DISPLAY" \
              --notes "" \
              --prerelease
          else
            gh release create snapshot \
              --target "$GITHUB_SHA" \
              --title "mqvpn $VERSION_DISPLAY" \
              --notes "" \
              --prerelease
          fi

          shopt -s nullglob
          assets=(artifacts/mqvpn_*.tar.gz artifacts/mqvpn_*.deb \
                  artifacts/mqvpn_*.zip artifacts/mqvpn_*_android.apk \
                  artifacts/SHA256SUMS scripts/install.sh LICENSE NOTICE)
          gh release upload snapshot --clobber "${assets[@]}"

          # Timestamped names differ every build; --clobber alone leaves old
          # binaries attached. Remove obsolete native assets only after every
          # current asset has uploaded successfully. Preserve other attachments.
          declare -A current_assets
          for asset in "${assets[@]}"; do current_assets["${asset##*/}"]=1; done
          gh release view snapshot --json assets --jq '.assets[].name' > published-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              mqvpn_*.tar.gz|mqvpn_*.deb|mqvpn_*.zip|mqvpn_*_android.apk)
                if [[ -z "${current_assets[$asset]:-}" ]]; then
                  gh release delete-asset snapshot "$asset" --yes
                fi ;;
            esac
          done < published-assets.txt
