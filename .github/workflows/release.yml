name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: release
    secrets: inherit

  # Reproducibility is a release-time contract, not just a PR check: F-Droid
  # rebuilds the tagged commit and byte-compares it against the APK we sign
  # here. Publishing a release we cannot reproduce would strand the F-Droid
  # listing, so gate publication on the same two-tree comparison.
  android-repro:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/android-repro.yml

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, android-repro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Download independently rebuilt APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repro-android
          path: artifacts

      - name: Verify the published APK reproduces
        env:
          UPLOAD_CERT_SHA256: F1:C5:D8:18:AE:C5:EA:4F:28:7B:44:CE:CC:1E:41:A0:AD:F2:B9:04:C8:EB:12:B3:41:F2:69:4F:BA:AB:B0:42
        # F-Droid verifies our releases by grafting our signature onto their
        # own rebuild and byte-comparing the result; apksigcopier is the tool
        # they use for it. Running the same check here means a release F-Droid
        # could not verify never gets published. Anything weaker (comparing
        # entry checksums, say) would pass on APKs whose compressed bytes,
        # entry order or alignment differ — exactly what grafting cannot
        # tolerate.
        run: |
          set -euo pipefail
          signed=$(ls artifacts/mqvpn_*_android.apk)
          repro=artifacts/repro-unsigned.apk
          test -f "$repro" || { echo "::error::rebuilt APK artifact missing"; exit 1; }
          build_tools=$(ls -d "${ANDROID_HOME:?}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          [ -n "$build_tools" ] \
            || { echo "::error::apksigner not found — no Android build-tools on this runner"; exit 1; }
          export PATH="$build_tools:$PATH"
          # The signer must be the canonical upload certificate. The keystore
          # preflight in build-android runs in a different job, and this job
          # only sees a downloaded artifact, so check the signature actually
          # on the APK we are about to publish. apksigner prints the digest
          # lowercase without separators; UPLOAD_CERT_SHA256 is in keytool's
          # colon-separated form.
          expected=$(printf '%s' "$UPLOAD_CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          digests=$(apksigner verify --print-certs "$signed" \
                    | sed -n 's/.*certificate SHA-256 digest: //p')
          # Exactly one signer: an extra co-signer would still graft and still
          # contain the canonical certificate, but it changes the app's signing
          # identity and breaks upgrades for existing installs.
          signers=$(printf '%s\n' "$digests" | grep -c . || true)
          [ "$signers" = "1" ] \
            || { echo "::error::expected exactly one APK signer, found $signers"; exit 1; }
          if [[ "$GITHUB_REPOSITORY" == mp0rta/mqvpn && "$digests" != "$expected" ]]; then
            echo "::error::published APK signer mismatch: got ${digests:-none}"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/apksigcopier-venv"
          "$RUNNER_TEMP/apksigcopier-venv/bin/pip" install --quiet \
            --require-hashes -r .github/requirements-apksigcopier.txt
          "$RUNNER_TEMP/apksigcopier-venv/bin/apksigcopier" compare "$signed" --unsigned "$repro"
          echo "Published APK has one verified signer and grafts onto the independent rebuild"

      - name: Verify complete platform set and generate SHA256SUMS
        run: bash scripts/prepare_publish_assets.sh artifacts "${GITHUB_REF_NAME#v}"

      - name: Attest build provenance
        # Signs Sigstore provenance (SLSA) for every released binary artifact.
        # Users verify with:
        #   gh attestation verify <file> --owner mp0rta
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/mqvpn_*.tar.gz
            artifacts/mqvpn_*.deb
            artifacts/mqvpn_*.zip
            artifacts/mqvpn_*_android.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          TARS=(artifacts/mqvpn_*.tar.gz)
          DEBS=(artifacts/mqvpn_*.deb)
          ZIPS=(artifacts/mqvpn_*.zip)
          APKS=(artifacts/mqvpn_*_android.apk)
          # SemVer pre-release identifier (anything after '-') → mark as
          # pre-release so it does not become the "Latest" release.
          # e.g. v0.4.0-beta1, v0.4.0-rc.1 → pre-release; v0.4.0 → latest.
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Body intentionally left empty — auto-generated notes are too noisy
          # (auto-sync upstream PRs, perf bench commits, etc. clutter the changelog).
          # Edit release notes manually after publish via GitHub UI or:
          #   gh release edit "$GITHUB_REF_NAME" --notes "..."
          gh release create "$GITHUB_REF_NAME" \
            --title "mqvpn v${VERSION}" \
            --notes "" \
            $PRERELEASE_FLAG \
            "${TARS[@]}" "${DEBS[@]}" "${ZIPS[@]}" "${APKS[@]}" \
            artifacts/SHA256SUMS \
            scripts/install.sh \
            LICENSE \
            NOTICE
