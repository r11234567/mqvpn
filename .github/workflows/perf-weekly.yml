name: Performance Tests (Weekly)
run-name: ${{ github.event.inputs.quick_udp == 'true' && 'UDP control quick check' || 'Performance Tests (Weekly)' }}

# Full benchmark suite, Sunday at 3:00 UTC. Stress has its own independent
# schedule; clock order does not create a completion dependency.
#
# Runs on a GitHub-hosted runner for the same reason perf.yml does, and its
# results carry the same caveat: shared cloud vCPUs, so read the series as a
# trend against this repo's own history, never as an absolute figure or as
# something comparable to upstream's dedicated box.
#
# Security: same restriction as perf.yml — no PR trigger, ever.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      quick_udp:
        description: 'Only fast control-close capture regression and eighteen 5-second UDP DL/50B samples; skips core/netsim suites and publishing.'
        required: false
        type: boolean
        default: false
      netsim_modes:
        description: >-
          Comma-separated netsim modes to narrow to (e.g. "classes,sched,tiers").
          Leave EMPTY for the full set of 16, which is what the schedule runs and
          what any conclusion about coverage needs.
        required: false
        default: ''
      skip_core:
        description: >-
          Skip the seven core benchmark families and run only the selected
          netsim jobs. Pairing, QUIC baselines, generator timeouts and path
          conditions determine the actual duration. A narrowed or core-skipped
          dispatch is partial coverage and must not be presented as a full weekly.
        required: false
        type: boolean
        default: false
      arms:
        description: >-
          Optional parallel arms: default, reorder_on, reorder_off, streams4,
          streams16, streams64. Separate jobs can use different physical VMs;
          those comparisons are observational. MTU and game comparisons run
          paired serial arms on the same VM regardless of this input.
        required: false
        default: ''
      wlb_instr:
        description: >-
          Collect xquic's scheduler and send-side counters (CI_BENCH_WLB_INSTR):
          the WLB per-path pin/packet/round split, and |send_supply| — whether
          each scheduling pass drained the queue (so the send side, not the
          paths, was the limit), stopped with capacity still available on some
          path (so the scheduler declined it), or stopped with everything
          blocked. Raises both ends' log level to info; both are once-a-second
          aggregates; logging cost must still be measured before comparing arms.
        required: false
        type: boolean
        default: false
      game_pps:
        description: >-
          Packets per second per direction for the game/vps modes
          (CI_BENCH_GAME_PPS). Empty keeps the harness default of 4267, which
          is 200 KB/s at a 20-byte mean payload plus 28 bytes of UDP+IP -- a
          realistic single game client. Set it to 17067 (800 KB/s, roughly 4x
          that) to drive past the knee: run 34084331771 lost 23-49% there with
          the TUN's own tx_dropped carrying all of it and its qdisc carrying
          none, while run 34086132803 at 2000 lost 0.016% on the same code.
          Both rates are worth keeping -- one shows the shipped behaviour, the
          other shows where it breaks.
        required: false
        default: ''
      iperf_streams:
        description: >-
          Inner TCP streams per sample (CI_BENCH_IPERF_STREAMS). Empty keeps the
          harness default of 4. Stream count changes aggregation and fairness;
          use 1/4/16/64 in the core sweep and compare matching configurations.
        required: false
        default: ''

permissions:
  contents: read

# Separate from perf.yml's group: they shared one only to serialize access to a
# single physical box, and hosted runs each get their own VM. The two write
# different R2 prefixes (perf-data/weekly vs perf-data), so their index.json
# read-modify-write cycles cannot collide either. cancel-in-progress stays off
# so a manual re-run queues behind a suite in flight instead of killing it.
concurrency:
  group: ${{ github.event.inputs.quick_udp == 'true' && 'perf-weekly-udp-quick' || 'perf-weekly' }}
  cancel-in-progress: false

jobs:
  perf-weekly:
    if: github.event.inputs.quick_udp == 'true' || github.event.inputs.skip_core != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.quick_udp == 'true' && 15 || 180 }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CI_BENCH_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned xquic source
        shell: bash
        run: bash scripts/check_xquic_pin.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libevent-dev libssl-dev pkg-config golang iptables iproute2 iperf3 netcat-openbsd \
            conntrack stress-ng tcpdump

      - name: Compute xquic SHA
        id: xqsha
        run: echo "sha=$(git submodule status third_party/xquic | awk '{print $1}' | tr -d '+-')" >> "$GITHUB_OUTPUT"

      - name: Resolve BoringSSL pin
        id: bssl-pin
        run: echo "sha=$(git -C third_party/xquic/third_party/boringssl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Same keys as perf.yml on purpose: identical flags, so the two workflows
      # share one cache entry instead of each paying for its own build.
      - name: Cache BoringSSL (gcc Release, perf)
        id: bssl-cache
        uses: actions/cache@v6
        with:
          path: third_party/xquic/third_party/boringssl
          key: bssl-${{ steps.bssl-pin.outputs.sha }}-linux-gcc-release-fpic-perf-v1

      - name: Build BoringSSL
        if: steps.bssl-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/xquic/third_party/boringssl
          mkdir -p build && cd build
          # See perf.yml re: why CMAKE_BUILD_TYPE is mandatory — results from
          # before this line were taken against an -O0 crypto library.
          cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
          make -j$(nproc) ssl crypto

      - name: Verify BoringSSL is an optimized build
        run: bash scripts/ci_check_bssl_optimized.sh third_party/xquic/third_party/boringssl/build

      - name: Cache xquic (gcc Release, perf)
        id: xquic-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/xquic/build
            third_party/xquic/include/xquic/xqc_configure.h
          key: xquic-${{ steps.xqsha.outputs.sha }}-linux-gcc-release-bssl-${{ steps.bssl-pin.outputs.sha }}-source-v1-perf-v1

      - name: Build xquic
        if: steps.xquic-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/xquic
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DSSL_TYPE=boringssl \
                -DXQC_ENABLE_BBR2=ON \
                -DXQC_ENABLE_FEC=ON \
                -DXQC_ENABLE_XOR=ON \
                -DCMAKE_C_FLAGS="-Wno-dangling-pointer" ..
          make -j$(nproc)

      - name: Build mqvpn (Release)
        id: benchmark-build
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DXQUIC_BUILD_DIR=../third_party/xquic/build ..
          make -j$(nproc)

      # --- Core benchmarks (same as push-to-main) ---

      - name: Raw throughput benchmark (TCP DL+UL)
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_raw_throughput.sh --full build/mqvpn

      - name: Failover benchmark (WLB + MinRTT)
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_failover.sh build/mqvpn

      - name: Aggregation benchmark (WLB + MinRTT)
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_aggregate.sh build/mqvpn

      # --- Extended benchmarks (weekly only) ---

      - name: Multipath scheduler benchmark (8 scenarios)
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_multipath_scheduler.sh build/mqvpn

      - name: UDP rate sweep benchmark
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_udp_sweep.sh build/mqvpn

      - name: NTN satellite benchmark
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_ntn.sh build/mqvpn

      - name: Backup FEC scheduler benchmark (lossy primary sweep)
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo bash scripts/ci_benchmarks/ci_bench_backup_fec.sh build/mqvpn

      - name: Fast control-close capture regression
        id: quick_capture
        if: ${{ !cancelled() && github.event.inputs.quick_udp == 'true' && steps.benchmark-build.outcome == 'success' }}
        run: sudo env CI_BENCH_CAPTURE_TEST_DIR="$PWD/ci_bench_results/quick-capture" bash tests/test_benchmark_udp_capture.sh

      - name: Focused UDP control reproduction (eighteen samples)
        id: quick_udp
        if: ${{ !cancelled() && github.event.inputs.quick_udp == 'true' && steps.quick_capture.outcome == 'success' }}
        run: |
          echo '> Partial diagnostic run: rapid control-close capture and UDP DL/50B at 5/10 Mbps, single/WLB/MinRTT. Not a full weekly.' >> "$GITHUB_STEP_SUMMARY"
          sudo env CI_BENCH_TEST_SCOPE=quick_udp_control CI_BENCH_UDP_SEC=5 \
            CI_BENCH_UDP_DIRECTIONS=DL CI_BENCH_UDP_SIZES=50 CI_BENCH_UDP_SMALL_RATES='5 10' \
            bash scripts/ci_benchmarks/ci_bench_udp_sweep.sh build/mqvpn

      - name: Enforce relative throughput health
        if: ${{ !cancelled() && github.event.inputs.quick_udp != 'true' && steps.benchmark-build.outcome == 'success' }}
        run: python3 scripts/ci_benchmarks/ci_bench_health.py ci_bench_results

      - name: Make bench artifacts readable by the runner
        if: always()
        run: if [ -d ci_bench_results ]; then sudo chown -R "$(id -u):$(id -g)" ci_bench_results; fi

      - name: Verify quick capture evidence independently of transfer outcome
        if: ${{ !cancelled() && github.event.inputs.quick_udp == 'true' && steps.benchmark-build.outcome == 'success' && steps.quick_udp.outcome != 'skipped' }}
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifests = list(Path('ci_bench_results/raw').rglob('*.evidence.json'))
          assert len(manifests)==18, f'expected eighteen sample manifests, got {len(manifests)}'
          for p in manifests:
              d=json.loads(p.read_text())
              assert d['capture']['status']=='complete', (str(p),d['capture'])
              assert not d['copy_errors'], (str(p),d['copy_errors'])
              for item in d['files']:
                  b=(p.parent/item['name']).read_bytes()
                  assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256'],item['name']
          print('PASS all eighteen UDP samples retained complete startup/control pcaps and matching artifact hashes')
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.quick_udp == 'true' && 'perf-udp-quick' || 'perf-weekly' }}-${{ github.sha }}
          path: ci_bench_results/
          retention-days: 90

      - name: Publish results to R2
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event.inputs.quick_udp != 'true' && env.R2_ACCOUNT_ID != '' }}
        run: bash scripts/ci_publish/publish_to_r2.sh perf-data/weekly weekly

      - name: Note that R2 publishing was skipped
        if: ${{ success() && github.event.inputs.quick_udp != 'true' && env.R2_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::R2_* secrets are not set — results are in this run's" \
               "artifact only, and the dashboard will not show this run."

  # ── Realistic-network scenario matrix ──────────────────────────────────
  #
  # Each path is built as access-leg + transit-leg over a chain of namespaces;
  # see docs/network_emulation_matrix.md for why the factor space is sampled
  # this way instead of enumerated (the full cross product is ~69k configs).
  #
  # These jobs deliberately do NOT publish to R2. publish_to_r2.sh is a
  # read-modify-write on one index.json, so six matrix jobs racing it would
  # clobber each other's entries. They upload artifacts and a single
  # downstream writer publishes them.
  # Builds the netsim matrix as modes x arms. A static matrix can be neither
  # narrowed nor doubled by an input, and both are wanted:
  #
  #   - The full 16 modes are the default, because a conclusion about coverage
  #     needs all of them. `netsim_modes` only narrows, and only on a dispatch.
  #   - `arms` runs the same modes twice in ONE dispatch, as parallel jobs. An
  #     A/B done as two dispatches is not just slower, it is weaker: these
  #     numbers move several percent run to run on shared runners, so the two
  #     sides have to be measured in the same run to be compared at all.
  netsim-select:
    if: github.event.inputs.quick_udp != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WANT: ${{ github.event.inputs.netsim_modes }}
          WANT_ARMS: ${{ github.event.inputs.arms }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          # Kept in step with the comments on each mode below.
          modes = [
              {"id": "paths",       "args": "paths"},
              {"id": "mixed",       "args": "mixed"},
              {"id": "classes",     "args": "classes"},
              {"id": "combo",       "args": "combo"},
              {"id": "special",     "args": "special"},
              {"id": "mtu",         "args": "mtu"},
              {"id": "sched",       "args": "sched"},
              {"id": "tiers",       "args": "tiers"},
              {"id": "cat_iplc",    "args": "catalog iplc"},
              {"id": "cat_opt",     "args": "catalog bgp_opt"},
              {"id": "cat_plain",   "args": "catalog bgp_plain"},
              {"id": "cat_junk",    "args": "catalog bgp_junk"},
              {"id": "cat_carrier", "args": "catalog carrier_qos"},
              # The three modes whose inner traffic is not TCP. Every mode
              # above measures iperf3 TCP through the tunnel, which for a QUIC
              # proxy leaves the protocol most of its traffic actually is
              # unmeasured -- and leaves wlb and wlb_udp_pin indistinguishable,
              # since the two differ only on inner UDP (flow_sched.c:61).
              # Jobs run in parallel, but each added mode can become the
              # longest job; no fixed wall-clock saving is assumed.
              {"id": "quic",        "args": "quic"},
              {"id": "game",        "args": "game"},
              {"id": "vps",         "args": "vps"},
          ]
          # An arm is a named set of env overrides, so any setting worth an A/B
          # can be one. "" leaves the harness default alone. Keep these keys in
          # step with the env block on the netsim job.
          arms = {
              "default":     {},
              "reorder_on":  {"reorder": "on"},
              "reorder_off": {"reorder": "off"},
              # Whether the aggregation deficit is really the inner stream count
              # (docs/network_emulation_matrix.md 1.3.7). Pairing these two is
              # the point: the metric moves with streams, so both sides have to
              # come from one run to mean anything.
              "streams4":    {"streams": "4"},
              "streams16":   {"streams": "16"},
              "streams64":   {"streams": "64"},
          }
          FIELDS = ("reorder", "streams")

          def parse(var, known, what):
              want = [w.strip() for w in os.environ.get(var, "").split(",") if w.strip()]
              bad = sorted(set(want) - set(known))
              if bad:
                  raise SystemExit(f"unknown {what}: {', '.join(bad)}; "
                                   f"known: {', '.join(sorted(known))}")
              return want

          want_modes = parse("WANT", {m["id"] for m in modes}, "netsim mode(s)")
          want_arms = parse("WANT_ARMS", arms, "arm(s)") or ["default"]

          sel = []
          for m in modes:
              if want_modes and m["id"] not in want_modes:
                  continue
              for a in want_arms:
                  # id is the artifact name, so it must be unique per cell.
                  suffix = "" if a == "default" else f"__{a}"
                  cell = {"id": m["id"] + suffix, "args": m["args"], "arm": a}
                  # Every field on every cell: an unset matrix key renders as
                  # the empty string in the env block, which is what "leave the
                  # default alone" means, but only if the key exists.
                  for f in FIELDS:
                      cell[f] = arms[a].get(f, "")
                  sel.append(cell)
          print("matrix=" + json.dumps({"include": sel}))
          PY

      - name: Show selection
        run: |
          echo "::notice::netsim modes: ${{ steps.pick.outputs.matrix }}"

  netsim:
    needs: netsim-select
    if: github.event.inputs.quick_udp != 'true'
    runs-on: ubuntu-latest
    # 90, not 60. The three fixes in docs/network_emulation_matrix.md §0.3
    # each cost wall-clock: run_pair now performs three real measurements
    # instead of one and two repeats of it, the sample is 4 x 10 s rather than
    # 1 x 6 s, and the tunnel wait is 40 s rather than 25. `classes` is the
    # longest mode at 13 pairs -- about 28 min typical, but ~49 min if every
    # tunnel wait runs to its cap, which leaves no headroom at 60. Partial
    # results now survive a cancellation, but the tail of the mode still would
    # not.
    timeout-minutes: 180
    strategy:
      fail-fast: false   # one bad scenario must not hide the other five
      # Built by netsim-select so a dispatch can narrow it; the mode list and
      # what each mode covers live there:
      #   classes     curated pairs by KIND of disagreement between the legs
      #               (capacity, latency, stability, NAT, MTU) plus real-world
      #               composites like fibre+tether and dual-mobile
      #   combo       covering set over access x transit x NAT x MTU
      #   special     the five special conditions, under saturating load
      #   mtu         the MTU axis alone, including the PMTUD black hole
      #   sched       WLB / MinRTT / backup-FEC over the classes where they differ
      #   tiers       server tiers and host contention, network held wide open
      #   cat_*       one transit profile against all ten access legs
      matrix: ${{ fromJSON(needs.netsim-select.outputs.matrix) }}
    env:
      CI_BENCH_COMMIT: ${{ github.sha }}
      # '1' only on a dispatch that asked for it; the schedule leaves the input
      # empty and so runs without instrumentation.
      CI_BENCH_WLB_INSTR: ${{ github.event.inputs.wlb_instr == 'true' && '1' || '0' }}
      # A/B arm for this cell. `arm` names it in the rows; `reorder` is empty on
      # the default arm, which leaves the built-in config untouched.
      CI_BENCH_ARM: ${{ matrix.arm }}
      CI_BENCH_REORDER: ${{ matrix.reorder }}
      # The arm wins when it sets streams; otherwise the dispatch input applies
      # to every arm; otherwise the script's own default, which is what keeps a
      # scheduled run comparable with the series.
      CI_BENCH_IPERF_STREAMS: ${{ matrix.streams || github.event.inputs.iperf_streams }}
      # gamegen's offered rate per direction. Empty leaves the harness default.
      CI_BENCH_GAME_PPS: ${{ github.event.inputs.game_pps }}
      # Per-second host and interface sampling. On for every mode, because the
      # send-side and CPU counters it produces are as useful on a bulk TCP row
      # as on a QUIC one -- and because the quic mode's oscillation metric is
      # computed from its series and would be silently absent without it.
      # Cost is measured and published per row (samp_cost_note), rather than
      # assumed negligible: one long-lived reader of /proc, not a process spawn
      # per sample.
      CI_BENCH_SAMPLE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned xquic source
        shell: bash
        run: bash scripts/check_xquic_pin.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libevent-dev libssl-dev pkg-config golang iptables iproute2 iperf3 netcat-openbsd \
            conntrack stress-ng tcpdump

      - name: Compute xquic SHA
        id: xqsha
        run: echo "sha=$(git submodule status third_party/xquic | awk '{print $1}' | tr -d '+-')" >> "$GITHUB_OUTPUT"

      - name: Resolve BoringSSL pin
        id: bssl-pin
        run: echo "sha=$(git -C third_party/xquic/third_party/boringssl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Same cache keys as the other perf jobs, so the matrix shares one
      # dependency build instead of each paying for its own.
      - name: Cache BoringSSL (gcc Release, perf)
        id: bssl-cache
        uses: actions/cache@v6
        with:
          path: third_party/xquic/third_party/boringssl
          key: bssl-${{ steps.bssl-pin.outputs.sha }}-linux-gcc-release-fpic-perf-v1

      - name: Build BoringSSL
        if: steps.bssl-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/xquic/third_party/boringssl
          mkdir -p build && cd build
          cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
          make -j$(nproc) ssl crypto

      - name: Cache xquic (gcc Release, perf)
        id: xquic-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/xquic/build
            third_party/xquic/include/xquic/xqc_configure.h
          key: xquic-${{ steps.xqsha.outputs.sha }}-linux-gcc-release-bssl-${{ steps.bssl-pin.outputs.sha }}-source-v1-perf-v1

      - name: Build xquic
        if: steps.xquic-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/xquic
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DSSL_TYPE=boringssl \
                -DXQC_ENABLE_BBR2=ON -DXQC_ENABLE_FEC=ON -DXQC_ENABLE_XOR=ON \
                -DCMAKE_C_FLAGS="-Wno-dangling-pointer" ..
          make -j$(nproc)

      - name: Build mqvpn (Release)
        id: benchmark-build
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DXQUIC_BUILD_DIR=../third_party/xquic/build ..
          make -j$(nproc)

      # picoquicdemo supplies INNER QUIC for `quic` and `mixed`. The build is
      # gated to those modes -- it is a clone plus two
      # cmake builds (picotls, then picoquicdemo) and every other mode would
      # pay for a binary it never runs.
      #
      # The cache holds the whole clone, not just the binary: PICO_CERT and
      # PICO_KEY point into third_party/picoquic/certs/, and
      # build_picoquic.sh does not generate them -- caching the binary alone
      # would restore a tree whose server cannot start.
      - name: Cache picoquic
        if: startsWith(matrix.id, 'quic') || startsWith(matrix.id, 'mixed')
        id: picoquic-cache
        uses: actions/cache@v6
        with:
          path: third_party/picoquic
          key: picoquic-${{ hashFiles('scripts/ci_interop/build_picoquic.sh') }}-linux-v1

      - name: Build picoquic
        if: (startsWith(matrix.id, 'quic') || startsWith(matrix.id, 'mixed')) && steps.picoquic-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci_interop/build_picoquic.sh

      - name: Scenario ${{ matrix.id }}
        run: sudo -E bash scripts/ci_benchmarks/ci_bench_paired.sh ${{ matrix.args }} build/mqvpn

      - name: Make bench artifacts readable by the runner
        if: always()
        run: if [ -d ci_bench_results ]; then sudo chown -R "$(id -u):$(id -g)" ci_bench_results; fi
      - name: Upload scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netsim-${{ matrix.id }}
          path: ci_bench_results/
          retention-days: 90

  # Does the subtraction the arms were run for, in the run that produced them.
  #
  # Without this the dispatch just leaves a pile of JSON and the comparison
  # happens by hand afterwards -- which is where the last round went wrong: two
  # settings were changed together, and nothing in the run said so. Reporting,
  # not gating: a gate here would leave the weekly permanently red (see
  # docs/network_emulation_matrix.md 0.4 L).
  netsim-compare:
    needs: netsim
    if: ${{ always() && github.event.inputs.quick_udp != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No merge-multiple: each artifact keeps its own directory, so the two
      # arms of a mode cannot overwrite each other's identically-named file.
      - name: Collect scenario artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netsim-*
          path: ab

      # Say so in the summary itself when the core benchmarks were skipped.
      # Otherwise a fast dispatch produces a summary that looks exactly like a
      # full weekly minus a few tables, and the absence is easy to read as "the
      # core numbers regressed to nothing" rather than "they were not run".
      - name: Note a partial dispatch
        if: github.event.inputs.skip_core == 'true'
        run: |
          {
            echo "> **Partial dispatch:** \`skip_core\` was set, so the core"
            echo "> benchmarks (raw throughput, failover, aggregation, multipath"
            echo "> scheduler, UDP sweep, NTN, backup FEC) did NOT run. Only the"
            echo "> netsim matrix below was measured. Do not compare this run"
            echo "> against the published series."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare arms
        run: |
          python3 scripts/ci_benchmarks/ci_bench_ab_report.py ab \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Single writer for the scenario results. Depends on perf-weekly as well as
  # the matrix so the two never rewrite perf-data/weekly/index.json at the same
  # time; `always()` keeps the scenario data publishable even if the long
  # benchmark job failed.
  netsim-publish:
    needs: [netsim, perf-weekly]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.quick_udp != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect scenario artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netsim-*
          merge-multiple: true
          path: ci_bench_results

      - name: Publish scenario results to R2
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        run: bash scripts/ci_publish/publish_to_r2.sh perf-data/weekly weekly

      - name: Note that R2 publishing was skipped
        if: ${{ env.R2_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::R2_* secrets are not set — scenario results are in the" \
               "netsim-* artifacts only."
