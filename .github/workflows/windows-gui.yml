name: Windows GUI native verification and packages

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      version:
        description: Optional distribution version for release asset names
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: mqvpn_windows_gui_

permissions:
  contents: read

jobs:
  verify-package:
    name: Native GUI and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            vs: Visual Studio 17 2022
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-arm
            vs: Visual Studio 18 2026
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mqvpn-windows-${{ matrix.arch }}
          path: build/core-artifact
      - name: Build and run production GUI checks natively
        shell: pwsh
        run: |
          ./tests/check_windows_gui_deps.ps1
          cmake -S windows/tests/config-contract -B build/gui-config-contract -G '${{ matrix.vs }}' -A ${{ matrix.cmake_arch }}
          if ($LASTEXITCODE -ne 0) { throw 'C configuration contract configure failed' }
          cmake --build build/gui-config-contract --config Debug
          if ($LASTEXITCODE -ne 0) { throw 'C configuration contract build failed' }
          $env:MQVPN_CONFIG_CONTRACT_EXE = (Resolve-Path build/gui-config-contract/Debug/config_contract.exe).Path
          $env:MQVPN_CONFIG_EVIDENCE = (Join-Path $PWD 'build/config-fixtures')
          dotnet build windows/tests/GUI.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'GUI test build failed' }
          & ./windows/tests/bin/Release/net9.0-windows/GUI.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'GUI behavior checks failed' }
      - name: Publish self-contained GUI and package the same-run core
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Resolve afresh in every job attempt, including failed-job reruns.
          ./scripts/resolve_windows_gui_deps.ps1 -LockFile build/gui-deps/dependency-lock.json
          ./scripts/package_windows_gui.ps1 -Arch ${{ matrix.arch }} -CoreDirectory build/core-artifact -DependencyLock build/gui-deps/dependency-lock.json
      - name: Unpack final ZIP and verify offline native runtime
        shell: pwsh
        run: |
          ./scripts/verify_windows_gui_package.ps1 -Arch ${{ matrix.arch }} -SourceSha '${{ inputs.source-sha }}' -ZipPath dist/mqvpn_windows_gui_${{ matrix.arch }}.zip -ReportDirectory build/package-reports
      - name: Upload screenshots and package verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-evidence-${{ matrix.arch }}
          path: |
            windows/tests/bin/Release/net9.0-windows/screenshots/
            build/package-reports/
            build/config-fixtures/
            dist/mqvpn_windows_gui_${{ matrix.arch }}/package-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stage versioned distribution ZIP
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force build/distribution | Out-Null
          $name = if ($env:PACKAGE_VERSION) { "mqvpn_$($env:PACKAGE_VERSION)_windows_gui_${{ matrix.arch }}.zip" } else { 'mqvpn_windows_gui_${{ matrix.arch }}.zip' }
          Copy-Item -LiteralPath 'dist/mqvpn_windows_gui_${{ matrix.arch }}.zip' -Destination (Join-Path build/distribution $name)
      - name: Upload verified distribution ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.arch }}
          path: build/distribution/*.zip
          if-no-files-found: error
          retention-days: 14
